name: Metrics

# Draws the cards shown in README.md with https://github.com/lowlighter/metrics and
# commits them to this branch as metrics.*.svg.
#
# The overview and featured-repository cards run on the built-in Actions token.
# Languages, habits and achievements need a personal token, so those two steps only
# run once the repository has a secret named METRICS_TOKEN: a personal access token
# (classic) with the scopes repo, read:user and read:org. Until then their SVG files
# are empty placeholders, which the README shows as nothing.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

env:
  TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
  HAS_PERSONAL_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Overview and contribution calendar
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          user: NunoGoncalves06
          filename: metrics.overview.svg
          output_action: commit
          template: classic
          base: header, activity
          config_timezone: Europe/Lisbon
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Featured repositories
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          user: NunoGoncalves06
          filename: metrics.repositories.svg
          output_action: commit
          template: classic
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: NunoGoncalves06/Wakecast, NunoGoncalves06/alchemists-arsenal

      - name: Languages and coding habits
        if: ${{ env.HAS_PERSONAL_TOKEN == 'true' && (success() || failure()) }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          user: NunoGoncalves06
          filename: metrics.code.svg
          output_action: commit
          template: classic
          base: ""
          # In Aarhus until January 2027; switch back to Europe/Lisbon after that.
          config_timezone: Europe/Copenhagen
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, jupyter notebook, shaderlab, hlsl, makefile, batchfile, roff
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Achievements
        if: ${{ env.HAS_PERSONAL_TOKEN == 'true' && (success() || failure()) }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          user: NunoGoncalves06
          filename: metrics.achievements.svg
          output_action: commit
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 8
