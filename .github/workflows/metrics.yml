name: Metrics
on:
  push:
    branches: ["dev/**"]
    paths: [.github/workflows/metrics.yml]
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: languages
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-languages.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, scss, shaderlab, hlsl

      - name: calendar
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-calendar.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1

      - name: followup
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-followup.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_followup: yes

      - name: lines
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-lines.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_lines: yes

      - name: stars
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-stars.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 3

      - name: topics
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-topics.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons

      - name: introduction
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-introduction.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_introduction: yes

      - name: notable
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-notable.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_notable: yes

      - name: activity
        if: ${{ always() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: NunoGoncalves06
          filename: test-activity.svg
          output_action: commit
          committer_branch: metrics-renders
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_visibility: public
