name: Metrics

# Renders the SVG cards shown in README.md with https://github.com/lowlighter/metrics
# and commits them to the "metrics-renders" branch, so main stays free of bot commits.
#
# Needs one repository secret, METRICS_TOKEN: a personal access token (classic) with the
# scopes repo, read:user and read:org. Without "repo" the cards only see public activity.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Overview and contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: overview.svg
          output_action: commit
          committer_branch: metrics-renders
          committer_message: "chore: update ${filename}"
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Lisbon
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Counts only the lines I authored, across my own repos and the course and team
      # repos I contribute to, so teammates' code is not credited to me.
      - name: Languages
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: languages.svg
          output_action: commit
          committer_branch: metrics-renders
          committer_message: "chore: update ${filename}"
          template: classic
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_skipped: david-s-brandao/dumps_ccna_website
          commits_authoring: NunoGoncalves06, Nuno Gonçalves
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, jupyter notebook, shaderlab, hlsl, makefile, batchfile, roff
          plugin_languages_analysis_timeout: 20

      - name: Coding habits
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: habits.svg
          output_action: commit
          committer_branch: metrics-renders
          committer_message: "chore: update ${filename}"
          template: classic
          base: ""
          # In Aarhus until January 2027; switch back to Europe/Lisbon after that.
          config_timezone: Europe/Copenhagen
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Achievements
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: achievements.svg
          output_action: commit
          committer_branch: metrics-renders
          committer_message: "chore: update ${filename}"
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
