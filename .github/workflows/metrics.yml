name: Metrics

# Layout option "terminal": draws its cards onto this branch so the README here can be previewed.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

env:
  TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
  HAS_PERSONAL_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Terminal card
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          user: NunoGoncalves06
          filename: metrics.terminal.svg
          output_action: commit
          committer_branch: main
          template: terminal
          base: header, activity
          config_timezone: Europe/Lisbon
          extras_css: |
            foreignObject > div:first-child { background: #000; border: 1px solid #1f7a4d; border-radius: 10px; overflow: hidden; }
            .header { flex-direction: row-reverse; justify-content: flex-end; height: 30px; padding: 0 12px; border-radius: 0; background: #04261a; border-bottom: 1px solid #0f4a30; }
            .title::before { content: "nuno@kali ~"; color: #35d07f; font-size: 14px; margin-left: 6px; }
            .button, .button.exit { font-size: 0; width: 11px; height: 11px; margin-right: 7px; text-shadow: none; background: #27c93f; }
            .button:nth-child(1) { background: #ff5f56; }
            .button:nth-child(2) { background: #ffbd2e; }
            pre, .title { font-family: 'Courier Prime', 'Courier New', monospace; }
            pre { background: #000; color: #35d07f; padding: 14px 16px 16px; border-radius: 0; font-size: 13px; }
            pre b { color: #7dffb0; }
            pre::before { display: block; white-space: pre; color: #35d07f; margin-bottom: 14px; line-height: 1.05; content: "#\a0 \a0 #\a0 \a0 \a0 ##\a0 \a0 \a0 #\a0 \a0 \a0 \a0 \a0 #\A#\a0 #\a0 \a0 \a0 #\a0 \a0 #\a0 \a0 #\a0 \a0 \a0 \a0 \a0 #\A##\a0 \a0 \a0 \a0 ####\a0 \a0 #\a0 \a0 \a0 \a0 \a0 #\A#\a0 #\a0 \a0 \a0 #\a0 \a0 #\a0 \a0 #\a0 \a0 \a0 \a0 \a0 #\A#\a0 \a0 #\a0 \a0 #\a0 \a0 #\a0 \a0 ####\a0 \a0 #"; }
            .ps1-path { font-size: 0; }
            .ps1-path::before { content: "nuno@kali"; font-size: 13px; color: #35d07f; }
            .ps1-location { color: #7dffb0; }
            .diff { color: #7dffb0; }
