name: Metrics

# Layout option "terminal": draws its cards onto this branch so the README here can be previewed.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

env:
  TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
  HAS_PERSONAL_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Terminal card
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.TOKEN }}
          user: NunoGoncalves06
          filename: metrics.terminal.svg
          output_action: commit
          committer_branch: main
          template: terminal
          base: header, activity
          config_timezone: Europe/Lisbon
          config_padding: 0, 6
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            foreignObject > div:first-child { background: #000; border: 1px solid #1f7a4d; border-radius: 6px; overflow: hidden; }
            .header { flex-direction: row-reverse; justify-content: flex-end; height: 19px; padding: 0 9px; border-radius: 0; background: #04261a; border-bottom: 1px solid #0f4a30; }
            .title::before { content: "nuno@kali ~"; color: #35d07f; font-size: 9px; margin-left: 4px; }
            .button, .button.exit { font-size: 0; width: 7px; height: 7px; margin-right: 5px; text-shadow: none; background: #27c93f; }
            .button:nth-child(1) { background: #ff5f56; }
            .button:nth-child(2) { background: #ffbd2e; }
            pre, .title { font-family: 'Courier Prime', 'Courier New', monospace; }
            pre { background: #000; color: #35d07f; padding: 10px 11px 0; margin-bottom: -12px; border-radius: 0; font-size: 8.1px; }
            pre b { color: #7dffb0; }
            pre, .stdin, .stdout { white-space: pre; overflow: hidden; }
