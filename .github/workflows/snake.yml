name: Contribution snake

# Draws the snake that eats the contribution graph and commits it to assets/.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#12307A&color_dots=#EEF3FC,#C9D8F7,#8FAEF0,#4F7DE3,#2B5FD9
            assets/snake-dark.svg?palette=github-dark&color_snake=#E9B949

      - name: Commit the SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update contribution snake"
          git pull --rebase origin main
          git push
